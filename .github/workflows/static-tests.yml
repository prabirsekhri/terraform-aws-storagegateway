---
name: Static Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]
jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5"

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: Init TFLint
        run: tflint --init --config .config/.tflint.hcl

      - name: Run TFLint
        run: tflint --config .config/.tflint.hcl

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          config_file: .config/.checkov.yml
          framework: terraform

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mdl
        run: sudo gem install mdl

      - name: Run Markdown Lint
        run: mdl --config .config/.mdlrc .header.md examples/*/.header.md

  terraform-docs:
    name: Terraform Docs Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render terraform docs
        uses: terraform-docs/gh-actions@v1.3.0
        with:
          config-file: .config/.terraform-docs.yaml
          output-file: README.md
          output-method: inject
          fail-on-diff: true
